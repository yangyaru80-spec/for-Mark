<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mark</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

.chat {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.msg {
  background: #1f1f1f;
  padding: 12px;
  border-radius: 10px;
  margin: 10px 0;
  opacity: 0;
  transition: 0.5s;
}

.show {
  opacity: 1;
}

img {
  width: 90%;
  border-radius: 10px;
  opacity: 0;
  transition: 2s;
}

#overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  opacity: 1;
  z-index: 999;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 启动层 -->
<div id="overlay" onclick="startAll()">
  <div>点击开始</div>
</div>

<!-- 音乐 -->
<audio id="music" loop>
  <source src="告白气球.钢琴版.-沈波#2uvlgk.mp3" type="audio/mpeg">
</audio>

<div class="chat" id="chat"></div>

<div class="chat">
  <img id="photo" src="mmexport1775756575498.jpg">
</div>

<script>
const messages = [
"在吗",
"今天想用另一种方式跟你说点话",
"……",
"刚刚在想",
"我们第一次见面的时候",
"那场面试",
"你坐在那里",
"看起来很冷静",
"而我却偏偏记住了你",
"……",
"后来才发现",
"有些人",
"不会随着时间变淡",
"反而会反复被想起",
"……",
"你大概就是这样",
"在很普通的日子里",
"反复出现",
"……",
"遇见你这件事",
"好像刚刚好",
"……",
"所以这次",
"你的生日愿望",
"我也想参与一点",
"……",
"生日快乐，Mark"
];

let i = 0;
const chat = document.getElementById("chat");

/* 启动所有 */
function startAll(){
  // 去掉黑屏
  document.getElementById("overlay").style.display="none";

  // 播放音乐
  const music = document.getElementById("music");
  music.volume = 0;
  music.play();

  let v = 0;
  let fade = setInterval(()=>{
    if(v < 1){
      v += 0.05;
      music.volume = v;
    } else {
      clearInterval(fade);
    }
  },200);

  // 开始剧情
  play();
}

/* 自动播放 */
function play(){
  if(i < messages.length){
    let div = document.createElement("div");
    div.className="msg";
    div.innerText=messages[i];
    chat.appendChild(div);

    setTimeout(()=>div.classList.add("show"),100);

    i++;
    setTimeout(play, 1300);

  } else {
    // 显示图片
    document.getElementById("photo").style.opacity=1;

    setTimeout(showFinal,2000);
  }
}

/* 最后收口 */
function showFinal(){
  setTimeout(()=>{
    document.body.innerHTML = `
    <div style="padding:100px 20px;line-height:1.8;">
      <p>如果你看到这里了——</p>

      <br>

      <p>那我就不再藏了</p>

      <br><br>

      <p>我不太想只是刚好认识你</p>

      <br><br>

      <p style="opacity:0.5;font-size:12px;">
      （这次真的说完了）
      </p>
    </div>
    `;
  },1500);
}
</script>

</body>
</html>
