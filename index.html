<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mark</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.chat {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.msg {
  background: #1f1f1f;
  padding: 12px 16px;
  border-radius: 15px;
  margin: 10px 0;
  max-width: 80%;
  margin-left: auto;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.5s;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

button {
  width: 100%;
  padding: 15px;
  background: #111;
  color: white;
  border: none;
  border-radius: 10px;
  margin-top: 20px;
}

#secret, #final {
  text-align: center;
  padding: 40px 20px;
  opacity: 0;
  transition: 2s;
}

#hint {
  text-align: center;
  font-size: 12px;
  opacity: 0;
  margin-top: 40px;
  cursor: pointer;
}

img {
  width: 90%;
  border-radius: 12px;
  margin-top: 20px;
  opacity: 0;
  transition: 2s;
}
</style>
</head>

<body onclick="startMusic()">

<!-- 🎵 音乐 -->
<audio id="music" loop>
  <source src="告白气球.钢琴版.-沈波#2uvlgk.mp3" type="audio/mpeg">
</audio>

<div class="chat" id="chat"></div>
<div class="chat">
  <button onclick="next()">继续</button>
</div>

<div class="chat" style="text-align:center;">
  <img id="photo" src="mmexport1775756575498.jpg">
</div>

<div id="secret"></div>
<div id="hint">（好像还有一句话）</div>
<div id="final"></div>

<script>
let started = false;
function startMusic(){
  if(!started){
    document.getElementById("music").play();
    started = true;
  }
}

const messages = [
"在吗",
"今天想用另一种方式跟你说点话",

"……",

"刚刚在想",
"我们第一次见面的时候",

"那场面试",

"你坐在那里",
"看起来很冷静",

"像是已经习惯了所有来来往往的人",

"而我只是其中一个",
"却偏偏记住了你",

"……",

"后来才发现",

"有些人",
"好像并不会随着时间变淡",

"反而会在不经意的时刻",
"一遍一遍被想起",

"……",

"你大概就是这样",

"像一束不会熄灭的光",

"在很普通的日子里",
"反复出现",

"……",

"惟愿春日不迟，相逢终有时",

"有时候会觉得",

"人与人之间的靠近",
"其实没有那么复杂",

"只是刚好在某个时间",

"遇见了一个",
"不太想错过的人",

"……",

"后来我翻遍很多表达",

"想找一个更准确的词",

"但好像都不太够",

"因为那些定义",
"都装不下你",

"……",

"如果一定要说",

"那大概是——",

"你出现在我生活里的方式",

"有点太刚好了",

"……",

"你是我三万零一季的惊蛰",

"……",

"所以这次",

"你的生日愿望",

"我可能也想参与一点",

"不用太多",

"一点点就好",

"……",

"生日快乐，Mark"
];

let i = 0;
let finished = false;
const chat = document.getElementById("chat");

function next(){
  if(i < messages.length){
    let div = document.createElement("div");
    div.className="msg";
    div.innerText=messages[i];
    chat.appendChild(div);

    setTimeout(()=>div.classList.add("show"),100);
    i++;
  } else if (!finished) {
    finished = true;
    document.getElementById("photo").style.opacity=1;
    showButton();
  }
}

function showButton(){
  let btn = document.createElement("button");
  btn.innerText="有一句话，其实刚刚没说";
  btn.onclick = showSecret;
  chat.appendChild(btn);
}

function showSecret(){
  const s = document.getElementById("secret");

  s.style.display="block";

  s.innerHTML=`
  <p>本来只是想说生日快乐。</p>
  <p>但好像没那么简单。</p>
  <br>
  <p>因为是你——</p>
  <p>所以很多事情，都会变得不一样。</p>
  <br>
  <p>只是——</p>
  <p>有些在意，好像藏不太住。</p>
  `;

  setTimeout(()=>s.style.opacity=1,200);

  setTimeout(()=>{
    const hint = document.getElementById("hint");
    hint.style.opacity=0.3;
    hint.onclick = showFinal;
  },4000);
}

function showFinal(){
  const final = document.getElementById("final");
  final.style.display="block";

  final.innerHTML=`
  <p>其实还有一句话。</p>
  <br>
  <p>既然你点到了这里——</p>
  <br><br>

  <p>那就当作，是你自己选择听的吧。</p>
  <br><br>

  <p>我好像，</p>
  <p>不只是刚好遇见你。</p>

  <br><br>

  <p id="ultimate" style="opacity:0.2;font-size:12px;cursor:pointer;">
  （还有一句）
  </p>
  `;

  setTimeout(()=>final.style.opacity=1,200);

  setTimeout(()=>{
    document.getElementById("ultimate").onclick = ()=>{
      showUltimate();
    }
  },1000);
}

function showUltimate(){
  document.body.innerHTML = "";

  setTimeout(()=>{
    document.body.innerHTML = `
    <div style="
      color:white;
      text-align:center;
      padding:100px 30px;
      font-size:18px;
      line-height:1.8;
    ">
      <p>本来这句话，</p>
      <p>是打算一直不说的。</p>

      <br><br>

      <p>但如果你已经看到这里了——</p>

      <br><br>

      <p>那我就当作，</p>
      <p>你其实也不介意知道一点点答案。</p>

      <br><br>

      <p>我不太想只是刚好认识你。</p>

      <br><br>

      <p style="opacity:0.6;font-size:12px;">
      （这次，真的没有下一句了）
      </p>
    </div>
    `;
  },2000);
}
</script>

</body>
</html>
